<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .text-container{
            display:flex;
            justify-content: center;
            font-family: Georgia, 'Times New Roman', Times, serif;  
            font-weight: 900;
            font-size: 60px;
            letter-spacing: 4px;
            perspective:20px ;
              }
        .text-container > b {
            height: 60px;
            width: 60px;
            box-shadow: 0px 16px 5px gray;
            background: linear-gradient( To right, red,green,blue,yellow);
            background-clip: text;
            color: transparent;
            transform-origin: left;
            animation: getUpDown  10s  infinite;
        }
        .text-container >b:nth-child(1){animation-delay: 0s;}
            .text-container >b:nth-child(2){animation-delay: 0.25s;}
            .text-container >b:nth-child(3){animation-delay: 0.50s;}
            .text-container >b:nth-child(4){animation-delay: 0.75s;}
             .text-container >b:nth-child(5){animation-delay: 1s;}
             .text-container >b:nth-child(6){animation-delay: 1.25s;}

             @keyframes getUpDown{
                from{transform: rotateX(-85deg);}
                10%,50%{transform: rotateX(0);}
                60%,to{transform: rotateX(-85deg);}

             }



    </style>
</head>
<body>
    <div class="text-container">
        <b>G</b><b>A</b><b>U</b><b>R</b><b>A</b><b>V</b>
    </div>
    
</body>
</html>
