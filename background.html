<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .linear{
            height:900px;
            background: linear-gradient(to right,black ,purple);
        }

  
        .bg-color {
            color:white;
            font-size:90px;
            text-align: center;
            padding-top:150px;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;

        }
        .radial{
            height:700px;
            /*ellipse*/
            background: radial-gradient(circle,black,red,blue);
        }
        .conic{
            height:700px;
            
            background: conic-gradient(from 30deg, black,yellow,black,yellow,black,yellow,black,yellow,black,yellow,black, yellow);
        }

    </style>
   
    
</head>
<body>
     <div class="conic"></div>
    <div class="radial"></div>
    <div class ="linear">
    <h1 class="bg-color">Welcome TO Mg Store</h1>

    </div>
</body>
</html>
