<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .flex-items{
            background-color: aqua;
            padding:10px;
            margin:10px;
            width:200px;
            height:200px;
            margin-top:10px;
            color:white;
            font-size:50px;
            text-align: center;
             display:flex;
            justify-content: center;
            align-items:center;
        }
        .flex-container{
            display:flex; 
            flex-wrap:wrap;
            flex-direction: row-reverse;
            /* space-evenly ,space-between, space-around,center */
            justify-content:space-evenly;
            list-style:none;

        }
    </style>
</head>
<body>
        <!-- ul.flex-container>li.flex-items*10 -->

    <ul class="flex-container">
        <li class="flex-items">1</li>
        <li class="flex-items">2</li>
        <li class="flex-items">3</li>
        <li class="flex-items">4</li>
        <li class="flex-items">5</li>
        <li class="flex-items">6</li>
        <li class="flex-items">7</li>
        <li class="flex-items">8</li>
        <li class="flex-items">9</li>
        <li class="flex-items">10</li>
    </ul>
    
</body>
</html>
